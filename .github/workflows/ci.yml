name: CI

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master, v1.0.1-dev]
  pull_request:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: nexus_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:ci-password@localhost:5432/nexus_blog?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Summarize production dependency advisories
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const report=require("./npm-audit.json"); const items=Object.entries(report.vulnerabilities||{}).map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable})); console.log(JSON.stringify({summary:report.metadata?.vulnerabilities,packages:items},null,2))'
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare Compose env file
        run: touch .env
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-password
      - run: docker build -t nexus-blog:ci .
